name: ci

on:
  push:
    branches: [main, optimize]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.12.10
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run --frozen ruff check src tests
      - name: Format check
        run: uv run --frozen ruff format --check src tests
      - name: Compile
        run: uv run --frozen python -m compileall -q src tests
      - name: Test
        env:
          UV_CACHE_DIR: /tmp/pi-claw-uv-cache
        run: uv run --frozen pytest
      - name: Build distributions
        run: uv build --no-config
