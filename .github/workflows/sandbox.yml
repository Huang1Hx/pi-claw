name: sandbox-security

on:
  pull_request:
    paths:
      - ".github/workflows/sandbox.yml"
      - "docker/sandbox/**"
      - "src/sandbox/**"
      - "src/evaluation/sandbox_cases.py"
      - "src/config/**"
      - "tests/test_docker_sandbox_integration.py"
      - "uv.lock"
      - "pyproject.toml"
  push:
    branches: [main, optimize]
    paths:
      - ".github/workflows/sandbox.yml"
      - "docker/sandbox/**"
      - "src/sandbox/**"
      - "src/evaluation/sandbox_cases.py"
      - "src/config/**"
      - "tests/test_docker_sandbox_integration.py"
      - "uv.lock"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  docker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.12.10
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Build pinned sandbox image
        run: docker build --file docker/sandbox/Dockerfile --tag pi-claw-sandbox:local .
      - name: Require Docker attack evaluation
        env:
          PI_CLAW_REQUIRE_DOCKER_INTEGRATION: "1"
          UV_CACHE_DIR: /tmp/pi-claw-uv-cache
        run: >-
          uv run --frozen pytest tests/test_docker_sandbox_integration.py
          -m docker_integration -q
      - name: Require zero residual Pi-Claw containers
        run: test -z "$(docker ps --all --quiet --filter name=^/pi-claw-)"
