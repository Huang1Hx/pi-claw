[project]
name = "pi-claw"
version = "0.1.0"
description = "可审计、可回放、权限受控的本地 Coding Agent"
readme = "README.MD"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["prompt-toolkit>=3.0.52,<4"]

[project.scripts]
pi-claw = "interfaces.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/commands",
  "src/config",
  "src/core",
  "src/evaluation",
  "src/interfaces",
  "src/persistence",
  "src/providers",
  "src/routing",
  "src/sandbox",
  "src/security",
  "src/skills",
  "src/tools",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "docker_integration: requires a running Docker daemon and the pinned local sandbox image",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
