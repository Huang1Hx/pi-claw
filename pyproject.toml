[project]
name = "pi-claw"
version = "0.1.0"
description = "可审计、可回放、权限受控的本地 Coding Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pi-claw = "pi_claw.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_claw"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

